# SystemAutorun 主配置文件
# 详见 plan: C:\Users\xntgr\.claude\plans\generic-dazzling-hejlsberg.md

version: 1

settings:
  log_dir: 'C:\_my\_systemautorun\logs'
  backup_dir: 'C:\_my\_systemautorun\backups'
  default_startup_delay: 5

# ─── Windows 进程（10 项）─────────────────────────────────────────────
tasks:
  # === 内网穿透 ===
  # （已移除 SakuraLauncher — 用户不再使用 SakuraFrp）

  # === 远程访问 ===
  - name: rustdesk
    type: windows
    enabled: true
    description: 'RustDesk 远程桌面'
    exec: 'C:\Program Files\RustDesk\RustDesk.exe'
    args: ['--tray']
    working_dir: 'C:\Program Files\RustDesk'
    startup_delay: 5
    health:
      type: process
      pattern: 'RustDesk.exe'

  - name: parsec
    type: windows
    enabled: true
    description: 'Parsec 远程桌面'
    exec: 'C:\Program Files\Parsec\parsecd.exe'
    args: ['app_silent=1']
    startup_delay: 5
    health:
      type: process
      pattern: 'parsecd.exe'

  # === 文件 / 媒体 ===
  - name: cloudreve
    type: windows
    enabled: true
    description: 'Cloudreve 网盘'
    exec: 'D:\_Website\cloudreve\cloudreve.exe'
    working_dir: 'D:\_Website\cloudreve'
    startup_delay: 10
    health:
      type: tcp
      host: '127.0.0.1'
      port: 5213
      timeout: 60

  - name: mt-photos-server
    type: windows
    enabled: true
    description: 'MT Photos 主服务'
    exec: 'D:\Program Files (x86)\MT Photos Server\mt-photos-server.exe'
    working_dir: 'D:\Program Files (x86)\MT Photos Server'
    startup_delay: 10
    health:
      type: tcp
      host: '127.0.0.1'
      port: 8063
      timeout: 60

  - name: mt-photos-ai
    type: windows
    enabled: true
    description: 'MT Photos AI 服务'
    exec: 'D:\Program Files (x86)\MT Photos AI\mt-photos-ai-server.exe'
    working_dir: 'D:\Program Files (x86)\MT Photos AI'
    startup_delay: 15
    health:
      type: process
      pattern: 'mt-photos-ai-server.exe'

  - name: jellyfin
    type: windows
    enabled: true
    description: 'Jellyfin 媒体服务器'
    exec: 'D:\Program Files\Jellyfin\Server\jellyfin.exe'
    startup_delay: 10
    health:
      type: tcp
      host: '127.0.0.1'
      port: 8096
      timeout: 90

  # === Web / 数据库 ===
  - name: phpenv
    type: windows
    enabled: true
    description: 'phpEnv (Apache + MySQL + PHP)'
    exec: 'D:\_Website\phpEnv\bin\phpEnv.exe'
    working_dir: 'D:\_Website\phpEnv\bin'
    startup_delay: 10
    health:
      type: process
      pattern: 'phpEnv.exe'

  # === 容器 ===
  - name: docker-desktop
    type: windows
    enabled: true
    description: 'Docker Desktop'
    exec: 'C:\Program Files\Docker\Docker\Docker Desktop.exe'
    startup_delay: 20
    health:
      type: process
      pattern: 'Docker Desktop.exe'

  # === 代理 ===
  - name: xray-windows
    type: windows
    enabled: true
    description: 'Xray 代理服务'
    exec: 'D:\_tools\Xray-windows-64\xray.exe'
    args: ['-config', '.\config.json']
    working_dir: 'D:\_tools\Xray-windows-64'
    startup_delay: 5
    health:
      type: process
      pattern: 'xray.exe'

  # === AI Agent (Windows native) ===
  - name: hermes-gateway-windows
    type: windows
    enabled: true
    description: 'Hermes Agent Gateway (Windows native)'
    exec: 'C:\Users\xntgr\AppData\Local\hermes\hermes-agent\venv\Scripts\hermes.exe'
    args: ['gateway', 'run', '--replace']
    working_dir: 'C:\Users\xntgr\AppData\Local\hermes\hermes-agent'
    startup_delay: 10
    health:
      type: process
      pattern: 'hermes.exe'

  # === 周边 ===
  - name: wifi-mouse-server
    type: windows
    enabled: true
    description: 'WiFi Mouse Server'
    exec: 'C:\Program Files (x86)\WifiMouseServer\WifiMouseServer.exe'
    working_dir: 'C:\Program Files (x86)\WifiMouseServer'
    startup_delay: 10
    health:
      type: process
      pattern: 'WifiMouseServer.exe'

  # ─── WSL 任务 ─────────────────────────────────────────────────────
  # === Ubuntu ===
  - name: wsl-boot-ubuntu
    type: wsl_boot
    enabled: true
    description: '唤醒 WSL Ubuntu，systemd 自动拉起已 enabled 服务'
    distro: 'Ubuntu'
    startup_delay: 0
    health:
      type: wsl_running
      distro: 'Ubuntu'

  - name: hermes-gateway-ubuntu
    type: wsl_systemd
    enabled: true
    description: 'Hermes Agent Gateway (Ubuntu systemd)'
    distro: 'Ubuntu'
    service: 'hermes-gateway'
    depends_on: ['wsl-boot-ubuntu']
    startup_delay: 5
    health:
      type: systemd_active
      distro: 'Ubuntu'
      service: 'hermes-gateway'
      timeout: 60

  # === xiaomao ===
  - name: wsl-boot-xiaomao
    type: wsl_boot
    enabled: true
    description: '唤醒 WSL xiaomao，systemd 自动拉起已 enabled 服务'
    distro: 'xiaomao'
    startup_delay: 0
    health:
      type: wsl_running
      distro: 'xiaomao'

  - name: hermes-gateway-xiaomao
    type: wsl_systemd
    enabled: true
    description: 'Hermes Agent Gateway (xiaomao systemd)'
    distro: 'xiaomao'
    service: 'hermes-gateway'
    depends_on: ['wsl-boot-xiaomao']
    startup_delay: 5
    health:
      type: systemd_active
      distro: 'xiaomao'
      service: 'hermes-gateway'
      timeout: 60
